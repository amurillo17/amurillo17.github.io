<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERSAVOX - We Are Happy</title>

  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #9ba1b0;
      --spotify-green: #1db954;
      --btn-hover: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow from artwork colors */
    .background-glow {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(29, 185, 84, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .cover-art {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    .song-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .artist-name {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .link-card:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .platform-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .platform-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .platform-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .platform-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .btn-action {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
    }

    /* Primary highlight for Spotify */
    .link-card.primary {
      border-color: rgba(29, 185, 84, 0.4);
      background: rgba(29, 185, 84, 0.08);
    }

    .link-card.primary .platform-icon {
      color: var(--spotify-green);
    }

    .link-card.primary .btn-action {
      background: var(--spotify-green);
      color: #000000;
      font-weight: 700;
    }

    .link-card:hover .btn-action {
      background: #ffffff;
      color: #000000;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

  <div class="background-glow"></div>

  <main class="container">
    <img src="we-are-happy.jpg" alt="We Are Happy Cover Art" class="cover-art" loading="eager">

    <h1 class="song-title">We Are Happy</h1>
    <h2 class="artist-name">VERSAVOX</h2>

    <div class="links-list">

      <a href="https://open.spotify.com/album/21EIjaxLMZ0xQTUSCelEoh" target="_blank" rel="noopener noreferrer"
        class="link-card primary">
        <div class="platform-info">
          <div class="platform-icon">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.494 17.306c-.216.353-.674.467-1.027.25-2.812-1.718-6.352-2.107-10.52-1.155-.403.092-.803-.16-.895-.563-.092[...]
            </svg>
          </div>
          <span class="platform-name">Spotify</span>
        </div>
        <span class="btn-action">Play</span>
      </a>

      <a href="https://music.apple.com/us/album/we-are-happy-uplifting-feel-good-song-single/6803488011?uo=4"
        target="_blank" rel="noopener noreferrer" class="link-card">
        <div class="platform-info">
          <div class="platform-icon">
            <svg viewBox="0 0 24 24">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02[...]
            </svg>
          </div>
          <span class="platform-name">Apple Music</span>
        </div>
        <span class="btn-action">Listen</span>
      </a>

      <a href="https://youtu.be/HDgpruW6vO4" target="_blank" rel="noopener noreferrer" class="link-card">
        <div class="platform-info">
          <div class="platform-icon" style="color: #ff0000;">
            <svg viewBox="0 0 24 24">
              <path
                d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 [...]
            </svg>
          </div>
          <span class="platform-name">YouTube</span>
        </div>
        <span class="btn-action">Watch</span>
      </a>

    </div>

    <footer class="footer">
      &copy; VERSAVOX. All rights reserved.
    </footer>
  </main>

</body>

</html>
