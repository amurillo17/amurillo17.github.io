<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERSAVOX - We Are Happy</title>

  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #9ba1b0;
      --spotify-green: #1db954;
      --btn-hover: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow from artwork colors */
    .background-glow {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(29, 185, 84, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .cover-art {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    .song-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .artist-name {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .link-card:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .platform-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .platform-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .platform-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .platform-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .btn-action {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
    }

    /* Primary highlight for Spotify */
    .link-card.primary {
      border-color: rgba(29, 185, 84, 0.4);
      background: rgba(29, 185, 84, 0.08);
    }

    .link-card.primary .platform-icon {
      color: var(--spotify-green);
    }

    .link-card.primary .btn-action {
      background: var(--spotify-green);
      color: #000000;
      font-weight: 700;
    }

    .link-card:hover .btn-action {
      background: #ffffff;
      color: #000000;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

  <div class="background-glow"></div>

  <main class="container">
    <img src="./we-are-happy.jpg" alt="We Are Happy Cover Art" class="cover-art" loading="eager">

    <h1 class="song-title">We Are Happy</h1>

          <div class="platform-icon" style="color: #ff0000;">
            <svg viewBox="0 0 24 24">
              <path
                d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />

          <span class="platform-name">YouTube</span>
        </div>
        <span class="btn-action">Watch</span>

    </div>

    <footer class="footer">
      &copy; VERSAVOX. All rights reserved.
    </footer>
  </main>

</body>

</html>
